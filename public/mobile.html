<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="theme-color" content="#172126"/>
<title>NavYug Mine Safety - Mobile</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--p:#172126;--s:#2f6664;--a:#b77a45;--d:#c0392b;--w:#e67e22;--ok:#27ae60;--bg:#f4f1ec;--card:#fff;--bdr:#e2ddd6;--mu:#8a8178;--mubg:#f0ede8;--tx:#1a1714;--txs:#6b635c;--r:12px;--rs:8px;--sh:0 1px 4px rgba(23,33,38,.08),0 4px 16px rgba(23,33,38,.04);--shl:0 8px 32px rgba(23,33,38,.14)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--tx)}
body{overscroll-behavior:none}
button{cursor:pointer;border:none;background:none;font-family:inherit}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:99px}
#app{display:flex;flex-direction:column;height:100%}
#tb{position:fixed;top:0;left:0;right:0;z-index:100;height:56px;background:var(--p);display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:0 2px 12px rgba(23,33,38,.3)}
#tb-menu{width:36px;height:36px;border-radius:var(--rs);background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:#fff}
.tb-btn{width:36px;height:36px;border-radius:var(--rs);background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;position:relative}
.nb{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--a);border:1.5px solid var(--p)}
#tb-logo{display:flex;align-items:center;gap:8px;flex:1}
#tb-logo .li{width:28px;height:28px;background:linear-gradient(135deg,#2f6664,#172126);border-radius:8px;display:flex;align-items:center;justify-content:center}
#tb-logo .li svg{width:16px;height:16px}
#tb-logo .lt{font-size:16px;font-weight:700;color:#fff}
#tb-logo .ls{font-size:10px;color:rgba(255,255,255,.5);line-height:1}
#ovr{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s}
#ovr.on{opacity:1;pointer-events:all}
#sb{position:fixed;top:0;left:0;bottom:0;z-index:201;width:260px;background:var(--p);transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:4px 0 32px rgba(0,0,0,.3)}
#sb.on{transform:translateX(0)}
.sbh{padding:16px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px}
.sbav{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--s),var(--p));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0}
.sbn{font-size:14px;font-weight:600;color:#fff}
.sbr{font-size:11px;color:rgba(255,255,255,.45);margin-top:1px}
.sbc{margin-left:auto;width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center}
.sbnav{flex:1;overflow-y:auto;padding:8px}
.sbl{font-size:10px;font-weight:600;color:rgba(255,255,255,.3);letter-spacing:.08em;text-transform:uppercase;padding:12px 8px 4px}
.ni{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--rs);color:rgba(255,255,255,.6);font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:1px;transition:background .15s}
.ni:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.9)}
.ni.on{background:rgba(47,102,100,.35);color:#fff}
.ni svg{width:18px;height:18px;flex-shrink:0}
.nib{margin-left:auto;background:var(--a);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px}
.sbf{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.sbo{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--rs);color:rgba(255,255,255,.45);font-size:13px;width:100%}
#main{margin-top:56px;flex:1;overflow-y:auto;padding-bottom:88px}
.pg{display:none;padding:16px;animation:fi .2s ease}
.pg.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#bn{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--card);border-top:1px solid var(--bdr);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(23,33,38,.06)}
.bi{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;border-radius:var(--rs);color:var(--mu);font-size:10px;font-weight:500;cursor:pointer}
.bi svg{width:20px;height:20px}
.bi.on{color:var(--s)}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.ch{padding:14px 16px 0;font-size:13px;font-weight:600}
.cc{padding:12px 16px 16px}
.cc.np{padding:0}
.ph{margin-bottom:16px}
.ph h1{font-size:20px;font-weight:700}
.ph p{font-size:12.5px;color:var(--txs);margin-top:2px}
.phr{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.sc{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh)}
.si{width:42px;height:42px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px}
.sl{font-size:11px;color:var(--mu);font-weight:500}
.sv{font-size:22px;font-weight:800;line-height:1.1}
.ss{font-size:10.5px;color:var(--mu);margin-top:1px}
.badge{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid transparent}
.bd{background:rgba(192,57,43,.12);color:#c0392b;border-color:rgba(192,57,43,.3)}
.bw{background:rgba(183,122,69,.12);color:#874f20;border-color:rgba(183,122,69,.3)}
.bs{background:rgba(39,174,96,.12);color:#1e8449;border-color:rgba(39,174,96,.3)}
.bo{background:var(--mubg);color:var(--mu);border-color:var(--bdr)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--rs);font-size:13px;font-weight:600;border:1px solid transparent;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}
.bp{background:var(--p);color:#fff}
.bse{background:var(--s);color:#fff}
.bo2{background:transparent;color:var(--tx);border-color:var(--bdr)}
.bsm{padding:6px 12px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg,.btn2 svg{width:15px;height:15px}
.inp,.inp2,input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--bdr);border-radius:var(--rs);background:var(--card);color:var(--tx);font-size:13.5px;appearance:none;-webkit-appearance:none;font-family:inherit;transition:border-color .15s}
.inp:focus,input:focus,select:focus,textarea:focus{outline:none;border-color:var(--s);box-shadow:0 0 0 3px rgba(47,102,100,.12)}
.fl{display:block;font-size:11.5px;font-weight:600;color:var(--txs);margin-bottom:5px}
.sbw{display:flex;align-items:center;gap:8px}
.sb2{flex:1;height:6px;border-radius:99px;background:var(--mubg);overflow:hidden}
.sbf2{height:100%;border-radius:99px;transition:width .5s ease}
.st{font-size:12px;font-weight:600;white-space:nowrap}
.li2{padding:12px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:flex-start;gap:12px;transition:background .15s}
.li2:last-child{border-bottom:none}
.srw{position:relative;margin-bottom:14px}
.srw svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--mu);pointer-events:none}
.srw .inp{padding-left:36px}
.bch{display:flex;flex-direction:column;gap:10px}
.bhl{font-size:11.5px;color:var(--txs);margin-bottom:4px;display:flex;justify-content:space-between}
.bht{height:8px;border-radius:99px;background:var(--mubg);overflow:hidden}
.bhf{height:100%;border-radius:99px}
.spk{display:flex;align-items:flex-end;gap:3px}
.spkb{flex:1;border-radius:3px 3px 0 0;min-width:4px}
.rm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ra{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--mubg);border-radius:8px}
.ral{font-size:11.5px;color:var(--txs);flex:1}
.spin{width:16px;height:16px;border:2px solid var(--bdr);border-top-color:var(--s);border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.mc{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:14px;display:flex;gap:12px;box-shadow:var(--sh);cursor:pointer;margin-bottom:10px}
.mci{width:44px;height:44px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,var(--p),var(--s));display:flex;align-items:center;justify-content:center}
.mci svg{width:22px;height:22px;color:#fff}
.pi{border:1.5px solid var(--bdr);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.pi.ok{border-color:rgba(39,174,96,.4);background:rgba(39,174,96,.04)}
.pi.fl{border-color:rgba(192,57,43,.4);background:rgba(192,57,43,.04)}
.uz{border:2px dashed var(--bdr);border-radius:var(--r);padding:32px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;cursor:pointer;transition:border-color .15s}
.uz:hover,.uz.dr{border-color:var(--s);background:rgba(47,102,100,.04)}
.uzi{width:52px;height:52px;border-radius:50%;background:rgba(47,102,100,.1);display:flex;align-items:center;justify-content:center}
.uzi svg{width:26px;height:26px;color:var(--s)}
.gap{margin-bottom:16px}
.cb{display:flex;align-items:center;gap:6px}
.cbt{flex:1;height:5px;border-radius:99px;background:var(--mubg);overflow:hidden}
.cbf{height:100%;border-radius:99px}
.cbs{font-size:10.5px;color:var(--mu);white-space:nowrap;font-family:monospace}
.nd{width:8px;height:8px;border-radius:50%;background:var(--a);flex-shrink:0;margin-top:6px}
.tb2{padding:5px 12px;border-radius:7px;font-size:12px;font-weight:600;color:var(--mu);background:var(--mubg);border:1px solid transparent;cursor:pointer;transition:all .15s}
.tb2.on{background:var(--p);color:#fff}
.tg{width:44px;height:24px;border-radius:99px;background:var(--bdr);position:relative;cursor:pointer;transition:background .2s}
.tg.on{background:var(--s)}
.tgt{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.tg.on .tgt{transform:translateX(20px)}
.es{display:flex;flex-direction:column;align-items:center;gap:10px;padding:40px 16px;text-align:center}
.es p{color:var(--mu);font-size:13px}
#toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);z-index:9999;background:var(--p);color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:500;box-shadow:var(--shl);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.mo{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
.mo.on{display:flex}
.ms{background:var(--card);border-radius:20px 20px 0 0;width:100%;padding:20px;max-height:85vh;overflow-y:auto}
.mh{width:36px;height:4px;border-radius:99px;background:var(--bdr);margin:0 auto 20px}
.mt{font-size:16px;font-weight:700;margin-bottom:16px}
#lp{display:none;flex-direction:column;min-height:100vh;background:linear-gradient(160deg,#0d1a1e,#172126 50%,#1e3830);padding:40px 24px;align-items:center;justify-content:center}
#lp.on{display:flex}
.llo{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:40px}
.lli{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--s),var(--p));display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(47,102,100,.4)}
.lli svg{width:36px;height:36px;color:#fff}
.lt2{font-size:26px;font-weight:800;color:#fff;text-align:center}
.ls2{font-size:13px;color:rgba(255,255,255,.45);text-align:center;margin-top:4px}
.lc{background:rgba(255,255,255,.05);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:28px 24px;width:100%;max-width:380px}
.lf{margin-bottom:16px}
.ll{font-size:12px;font-weight:600;color:rgba(255,255,255,.55);margin-bottom:6px;display:block}
.li3{width:100%;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:14px;font-family:inherit}
.li3:focus{outline:none;border-color:var(--s)}
.li3::placeholder{color:rgba(255,255,255,.3)}
.lb{width:100%;padding:13px;border-radius:10px;background:linear-gradient(135deg,var(--s),#1e4e4c);color:#fff;font-size:15px;font-weight:700;margin-top:8px;cursor:pointer;border:none;font-family:inherit}
.lor{text-align:center;color:rgba(255,255,255,.25);font-size:12px;margin:16px 0}
.lds{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ldc{padding:6px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6);font-size:11.5px;font-weight:600;cursor:pointer}
.ldc:hover{background:rgba(255,255,255,.08)}
.wi{background:rgba(39,174,96,.12);color:#1e8449;border:1px solid rgba(39,174,96,.3)}
.ws{background:rgba(192,57,43,.12);color:#c0392b;border:1px solid rgba(192,57,43,.3);animation:ps 1.5s ease infinite}
@keyframes ps{0%,100%{opacity:1}50%{opacity:.5}}
@media(min-width:700px){#main,#tb,#bn{max-width:500px;margin-left:auto;margin-right:auto;left:50%;transform:translateX(-50%);right:auto}}
</style>
</head>
<body>
