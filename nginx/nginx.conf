worker_processes 1;

events { worker_connections 1024; }

http {
    upstream auth      { server auth-service:8000; }
    upstream compliance { server compliance-service:8000; }
    upstream inspection { server inspection-service:8000; }
    upstream violation  { server violation-service:8000; }
    upstream notification { server notification-service:8000; }
    upstream ai         { server ai-engine:8000; }

    server {
        listen 80;

        location /api/v1/auth/      { proxy_pass http://auth/v1/auth/;         proxy_set_header Host $host; }
        location /api/v1/users/     { proxy_pass http://auth/v1/users/;        proxy_set_header Host $host; }
        location /api/v1/mines/     { proxy_pass http://auth/v1/mines/;        proxy_set_header Host $host; }
        location /api/v1/compliance/ { proxy_pass http://compliance/v1/compliance/; proxy_set_header Host $host; }
        location /api/v1/inspections/ { proxy_pass http://inspection/v1/inspections/; proxy_set_header Host $host; }
        location /api/v1/violations/  { proxy_pass http://violation/v1/violations/;  proxy_set_header Host $host; }
        location /api/v1/notifications/ { proxy_pass http://notification/v1/; proxy_set_header Host $host; }
        location /api/v1/predictions/   { proxy_pass http://ai/v1/predictions/;     proxy_set_header Host $host; }

        location /health {
            return 200 '{"status":"ok","gateway":"nginx"}';
            add_header Content-Type application/json;
        }
    }
}
